name: Antora Build Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Antora site
        run: |
          mkdir -p www && chmod 777 www
          docker run --rm -v "${{ github.workspace }}:/antora" -v "${{ github.workspace }}/www:/output" quay.io/rhpds/antora:v1.3.0 --stacktrace site.yml

      - name: Verify output
        run: |
          echo "Output contents:"
          find www -name '*.html' | head -10
          count=$(find www -name '*.html' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No HTML files generated"
            exit 1
          fi
          echo "Build successful: $count HTML files generated"
