name: Antora Build Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Antora site
        run: docker run --rm -v "${{ github.workspace }}:/antora" quay.io/rhpds/antora:v1.3.0 --stacktrace site.yml

      - name: Verify output
        run: |
          if [ ! -f www/modules/index.html ]; then
            echo "ERROR: index.html not found in output"
            exit 1
          fi
          echo "Build successful: $(find www -name '*.html' | wc -l) HTML files generated"
